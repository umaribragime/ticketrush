services:
  postgres:
    image: postgres:17
    container_name: ticketrush-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ticketrush
    volumes:
      - ticketrush-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web page to look inside the database: http://localhost:8081
  # Login → System: PostgreSQL · Server: postgres · Username/Password/Database: ticketrush
  adminer:
    image: adminer:5
    container_name: ticketrush-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ticketrush-pgdata:
