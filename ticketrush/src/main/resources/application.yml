spring:
  application:
    name: ticketrush
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ticketrush}
    username: ${DB_USERNAME:ticketrush}
    password: ${DB_PASSWORD:ticketrush}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    # Dev-only default. In production set JWT_SECRET (at least 32 characters).
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-chars-min}
    expiration: ${JWT_EXPIRATION:PT2H}
    issuer: ticketrush
  order:
    max-tickets-per-order: 4
    # How stock is taken under concurrency: ATOMIC (default) | PESSIMISTIC | OPTIMISTIC | NAIVE (unsafe, demo only)
    stock-strategy: ${STOCK_STRATEGY:ATOMIC}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
